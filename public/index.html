<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1422">
  <meta name="description" content="Buxcoin — simulateur de trading avec argent 100% fictif : marchés en temps réel, portefeuille virtuel, IA d'analyse.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Buxcoin">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Buxcoin — Simulateur de trading</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" hidden>
      <div class="brand">
        <img src="/icons/icon-192.png" alt="Buxcoin" class="brand-logo">
        <span class="brand-name">Buxcoin</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="sim-badge">SIMULATEUR · argent 100% fictif</div>
        <button id="logout-btn" class="btn btn-ghost btn-block">Déconnexion</button>
      </div>
    </aside>
    <main id="main" class="main">
      <div id="view" class="view"></div>
    </main>
    <nav id="bottombar" class="bottombar" hidden></nav>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
  <div id="notif-dot" class="notif-dot" hidden>●</div>
  <script src="/js/api.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
